name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-macos:
    name: Tests (macOS system Python)
    # The launcher runs on the Founder's Mac under /usr/bin/python3, so test with exactly that interpreter.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show the interpreter
        run: /usr/bin/python3 --version
      - name: Parse the configuration
        run: |
          /usr/bin/python3 -m json.tool config/products.json > /dev/null
          /usr/bin/python3 -m json.tool config/guardrails/runtime.json > /dev/null
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s src/tests -t src -v
      - name: Launcher entry point starts
        run: src/bin/gr0wthlab --help

  tests-latest:
    name: Tests (latest Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python -m unittest discover -s src/tests -t src -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install ruff
        run: python -m pip install ruff==0.15.20
      - name: Ruff
        run: |
          ruff check src src/bin/gr0wthlab
          ruff format --check src src/bin/gr0wthlab
